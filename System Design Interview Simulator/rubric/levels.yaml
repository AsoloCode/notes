# Пороги грейдов и ожидания по уровням.
# Балл считается по rubric/rubric.yaml (0..100).
schema: levels/1.0

thresholds:
  # total >= min_total  →  грейд (берём первый подходящий сверху вниз)
  - grade: staff
    min_total: 85
  - grade: senior
    min_total: 70
  - grade: mid
    min_total: 55
  - grade: junior
    min_total: 35
  - grade: not_ready
    min_total: 0

grades:
  junior:
    title: "Junior / L3"
    expectation: "Собирает рабочий baseline по функциональным требованиям, задаёт простые вопросы, следует структуре."
    must_have:
      - "Разделяет функциональные и нефункциональные требования."
      - "Может объяснить end-to-end поток одной ручки."
      - "Знает, зачем нужны БД, кэш и очередь — хотя бы на уровне назначения."
    not_required:
      - "Оценка нагрузки с точностью"
      - "Компромиссы по консистентности"

  mid:
    title: "Mid / L4"
    expectation: "Проектирует работающую систему с осмысленными компонентами; считает нагрузку; называет базовые компромиссы."
    must_have:
      - "Back-of-envelope: QPS, объём, read/write ratio."
      - "Обосновывает выбор хранилища под паттерн доступа."
      - "Описывает репликацию/шардирование и зачем."
      - "Называет хотя бы один режим отказа и защиту (retry/идемпотентность)."
    not_required:
      - "Анализ стоимости"
      - "Поэтапная деградация"

  senior:
    title: "Senior / L5"
    expectation: "Ведёт интервью; количественно обосновывает решения; разбирает отказы, консистентность и узкие места; явно торгуется компромиссами."
    must_have:
      - "Явные trade-offs с условием выбора."
      - "Узкие места и способы их снятия (hot keys, skew, hotspots)."
      - "Разбирает консистентность: strong vs eventual, где какая."
      - "Наблюдаемость: метрики/алерты/SLO."
      - "Идемпотентность и безопасные ретраи для write-операций."
    not_required:
      - "Оптимизация стоимости на уровне инстансов"

  staff:
    title: "Staff / L6"
    expectation: "Как senior, плюс системное мышление: эволюция, стоимость, организационные границы, предвидение отказов и multi-region."
    must_have:
      - "Эволюция: что менять при 10× росте, точки разлома."
      - "Стоимость и ёмкость (infra cost/count)."
      - "Мульти-регион/мульти-AZ и влияние на консистентность."
      - "Границы сервисов и владение данными."
      - "План миграции/вывода из эксплуатации."
    not_required: []

debrief_rule: >-
  Итоговая оценка — взвешенный балл, но любой red flag из rubric.yaml должен быть
  явно прокомментирован в разборе. Один критичный red flag (игнор нефункциональных
  требований, отсутствие trade-offs, ретраи без идемпотентности) переносит грейд не выше mid,
  даже если сумма баллов выше порога.
