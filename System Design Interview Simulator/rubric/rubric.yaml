# Rubric для оценки System Design интервью.
# Используется симулятором (tools/session.py) и для ручной самооценки.
# Шкала: 0..4. Итог = сумма(score/4 * weight), максимум 100.
schema: rubric/1.0
scale:
  min: 0
  max: 4
  labels:
    0: "не раскрыто / отсутствует"
    1: "слабо: есть попытка, но с ошибками и без структуры"
    2: "базово: рабочее, но поверхностно, без чисел и компромиссов"
    3: "сильно: обосновано, с числами и компромиссами, отвечает на follow-up"
    4: "образцово: как 3, плюс предвидит отказы, стоимость и эволюцию"

dimensions:

  - id: requirements
    title: "Требования и скоуп"
    weight: 20
    description: "Разделяет функциональные и нефункциональные требования, сужает границы задачи, задаёт уточняющие вопросы."
    anchors:
      0: "Не задаёт вопросов, не разделяет требования."
      1: "Путает функциональные и нефункциональные; скоуп размыт."
      2: "Задаёт базовые вопросы, но не фиксирует латентность/доступность/консистентность."
      3: "Чётко разделяет, задаёт ключевые уточняющие вопросы, фиксирует in/out of scope."
      4: "Дополнительно уточняет SLA, стоимость ошибок, ожидания по росту и приоритеты."
    strong_signals:
      - "Спрашивает масштаб: DAU, QPS, объём данных."
      - "Спрашивает про консистентность и допустимость потери данных."
      - "Явно выносит что-то из скоупа."
    red_flags:
      - "Сразу переходит к рисованию компонентов."

  - id: architecture
    title: "High-level архитектура"
    weight: 20
    description: "Собирает компоненты в связный поток данных, обосновывает выбор каждого."
    anchors:
      0: "Нет связной схемы."
      1: "Набор коробок без потока данных."
      2: "Рабочий baseline, но компоненты не обоснованы."
      3: "Связный поток, компоненты обоснованы требованиями."
      4: "Учитывает потоки управления и данных, границы сервисов, sync vs async."
    strong_signals:
      - "Проводит end-to-end поток по критичному сценарию."
      - "Объясняет синхронные и асинхронные участки."
    red_flags:
      - "Архитектура не следует из сформулированных требований."

  - id: data_model
    title: "Модель данных и хранилище"
    weight: 15
    description: "Сущности, ключи, выбор типа хранилища, индексы, партиционирование."
    anchors:
      0: "Модель данных отсутствует."
      1: "Сущности есть, ключи/хранилище не продуманы."
      2: "Базовая модель, выбор БД без обоснования от паттерна доступа."
      3: "Модель под паттерн доступа, обоснован выбор БД, есть индексы/ключи шардирования."
      4: "Учитывает skew, денормализацию, двойную запись и миграцию схемы."
    strong_signals:
      - "Выбирает хранилище от паттерна доступа (KV/search/time-series/OLTP/OLAP)."
      - "Проговаривает ключ шардирования и его hot spots."
    red_flags:
      - "«Возьмём PostgreSQL» как единственный аргумент без обоснования."

  - id: deep_dive
    title: "Deep dive и trade-offs"
    weight: 20
    description: "Back-of-envelope оценка, узкие места, компромиссы, альтернативы."
    anchors:
      0: "Нет ни чисел, ни компромиссов."
      1: "Числа без методики или компромиссы декларативны."
      2: "Базовые оценки; один-два компромисса."
      3: "Корректные оценки с допущениями; явные trade-offs с условием выбора."
      4: "Оценивает альтернативы, стоимость, 10× рост и точку, где решение ломается."
    strong_signals:
      - "Называет bottleneck и способ его снять."
      - "Формулирует trade-off как «X против Y при условии Z»."
    red_flags:
      - "«Оно масштабируется» без механизма и чисел."
      - "«Зависит от ситуации» без выбора."

  - id: reliability
    title: "Надёжность и эксплуатация"
    weight: 10
    description: "Режимы отказа, деградация, идемпотентность, наблюдаемость, восстановление."
    anchors:
      0: "Отказоустойчивость не обсуждается."
      1: "Упоминает реплики/бэкапы без разбора отказов."
      2: "Базовая репликация и retry, но без идемпотентности и наблюдаемости."
      3: "Разбирает blast radius, деградацию, идемпотентность, метрики/алерты."
      4: "Проектирует режимы отказа, поэтапную деградацию, восстановление и runbook."
    strong_signals:
      - "Различает retry-safe и неидемпотентные операции."
      - "Описывает деградацию (что ломаем первым)."
    red_flags:
      - "Ретраи без идемпотентности."

  - id: communication
    title: "Коммуникация и ведение"
    weight: 15
    description: "Ведёт диалог, проговаривает допущения, держит темп и структуру."
    anchors:
      0: "Молчит/теряется, структура отсутствует."
      1: "Прыгает между темами, не проговаривает решения."
      2: "Идёт по шагам, но реактивен, редко объясняет «почему»."
      3: "Ведёт интервью, проговаривает допущения и решения, отвечает на follow-up."
      4: "Управляет скоупом и временем, сам предлагает следующий шаг и проверяет понимание."
    strong_signals:
      - "Объявляет переход между фазами."
      - "Помечает предположения как предположения."
    red_flags:
      - "Не отвечает на follow-up, уходит в сторону."

scoring:
  formula: "total = sum(score[dim]/4 * weight[dim])"
  max_total: 100
  rounding: 1
  pass_hint: "См. rubric/levels.yaml (пороги по грейдам)."

sources:
  - "Консенсус публичных рубрик: requirements, HLD, data model, deep dives/trade-offs, reliability/ops, communication (веса 20/20/15/20/10/15)."
  - "Рамка 7 шагов интервью: requirements → estimation → API → data model → HLD → deep dive → trade-offs/failure."
  - "[[SSL.BAND Систем Дизайн/08 - Как пройти system design интервью (от Andrii Bui) — sys-des-checklist/notes|SSL.BAND: чек-лист интервью]]"
